<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Head / Face Body -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bgGrad)" stroke="#a5b4fc" stroke-opacity="0.45" stroke-width="1.25"/>

  <!-- AI Sparkle on Top-Right -->
  <path d="M25 4.5 C25 5.8 26 6.8 27.3 6.8 C26 6.8 25 7.8 25 9.1 C25 7.8 24 6.8 22.7 6.8 C24 6.8 25 5.8 25 4.5 Z" fill="#fde047" opacity="0.9"/>

  <!-- Left Eye -->
  <g class="eye-group">
    <ellipse cx="10.5" cy="14" rx="2.5" ry="3.5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="11.5" cy="12.8" r="0.9" fill="#e0e7ff"/>
  </g>

  <!-- Right Eye -->
  <g class="eye-group">
    <ellipse cx="21.5" cy="14" rx="2.5" ry="3.5" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="22.5" cy="12.8" r="0.9" fill="#e0e7ff"/>
  </g>

  <!-- Friendly Resting Smile -->
  <path d="M 12 21 Q 16 23.8 20 21" stroke="#f1f5f9" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>
