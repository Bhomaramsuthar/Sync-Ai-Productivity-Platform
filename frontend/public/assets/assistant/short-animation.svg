<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGradIdle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glowIdle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .eyes-glance {
        animation: sideToSideGlance 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) forwards;
        transform-origin: 16px 14px;
      }
      .eye-blink-idle {
        animation: blinkAtCenter 2.4s ease-in-out forwards;
        transform-origin: center;
      }
      .left-eye-idle {
        transform-origin: 10.5px 14px;
      }
      .right-eye-idle {
        transform-origin: 21.5px 14px;
      }
      .subtle-tilt {
        animation: headTilt 2.4s ease-in-out forwards;
        transform-origin: 16px 26px;
      }

      @keyframes sideToSideGlance {
        0% {
          transform: translate(0px, 0px);
        }
        12% {
          transform: translate(-2.8px, -0.2px);
        }
        36% {
          transform: translate(-2.8px, -0.2px);
        }
        56% {
          transform: translate(2.8px, -0.2px);
        }
        76% {
          transform: translate(2.8px, -0.2px);
        }
        90% {
          transform: translate(0px, 0px);
        }
        100% {
          transform: translate(0px, 0px);
        }
      }

      @keyframes blinkAtCenter {
        0%, 82%, 94%, 100% {
          transform: scaleY(1);
        }
        88% {
          transform: scaleY(0.1);
        }
      }

      @keyframes headTilt {
        0%, 100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-3deg);
        }
        65% {
          transform: rotate(3deg);
        }
        90% {
          transform: rotate(0deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .eyes-glance, .eye-blink-idle, .subtle-tilt {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Head with subtle tilt -->
  <g class="subtle-tilt">
    <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#bgGradIdle)" stroke="#c7d2fe" stroke-opacity="0.5" stroke-width="1.25"/>

    <!-- AI Sparkle -->
    <path d="M25 4.5 C25 5.8 26 6.8 27.3 6.8 C26 6.8 25 7.8 25 9.1 C25 7.8 24 6.8 22.7 6.8 C24 6.8 25 5.8 25 4.5 Z" fill="#fde047" opacity="0.95"/>

    <!-- Eyes Glancing Side-to-Side -->
    <g class="eyes-glance">
      <!-- Left Eye -->
      <ellipse class="eye-blink-idle left-eye-idle" cx="10.5" cy="14" rx="2.5" ry="3.5" fill="#ffffff" filter="url(#glowIdle)"/>
      <circle cx="11.5" cy="12.8" r="0.9" fill="#e0e7ff"/>

      <!-- Right Eye -->
      <ellipse class="eye-blink-idle right-eye-idle" cx="21.5" cy="14" rx="2.5" ry="3.5" fill="#ffffff" filter="url(#glowIdle)"/>
      <circle cx="22.5" cy="12.8" r="0.9" fill="#e0e7ff"/>
    </g>

    <!-- Resting Smile -->
    <path d="M 12 21 Q 16 23.8 20 21" stroke="#f1f5f9" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
